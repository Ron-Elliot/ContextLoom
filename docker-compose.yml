version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: contextloom
      POSTGRES_PASSWORD: contextloom
      POSTGRES_DB: contextloom
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contextloom']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
